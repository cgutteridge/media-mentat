[project]
name = "fiction-recommender-skill"
version = "0.1.0"
description = "Portable evidence-gated fiction recommendation skill and helpers"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["evidence_gate", "finding_cache", "consumption_certainty", "recommend_pull", "recommender_workspace"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evidence_gate*", "finding_cache*", "consumption_certainty*", "recommend_pull*", "recommender_workspace*"]
